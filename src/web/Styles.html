<style>
  :root { --bg:#f3f5fa; --card:#fff; --ink:#1b2333; --muted:#667085; --line:#e6e9f0; --brand:#3b5bdb; --brand-2:#6741d9; --brand-soft:#eef2ff; --brand-ink:#fff;

          --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05); --side:#101a3a; --side-ink:#c9d2ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e121c; --card:#171d2c; --ink:#e8ebf2; --muted:#98a2b3; --line:#283046; --brand:#7c94ff; --brand-2:#a58bff; --brand-soft:#212a4a; --brand-ink:#0b1020;
            --ok:#47c79c; --ok-soft:#133127; --warn:#f0a15a; --warn-soft:#3a2915; --bad:#ff7b70; --bad-soft:#3b1a18;

  body { margin:0; font:14px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }
  a.linkbtn { background:var(--brand-soft); padding:.15rem .6rem; border-radius:999px; font-weight:600; font-size:.85em; } a.linkbtn:hover { text-decoration:none; filter:brightness(.97); }
  h1,h2,h3 { margin:0 0 .5rem; line-height:1.25; letter-spacing:-.01em; } h2 { font-size:1.35rem; } h3 { font-size:1.05rem; }
  .muted { color:var(--muted); } .small-text { font-size:.8rem; } .right { margin-left:auto; } .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }

  /* --- kerangka --- */
  .layout { display:grid; grid-template-columns:248px 1fr; min-height:100vh; }
  aside { background:linear-gradient(180deg,var(--side),#16224d); color:var(--side-ink); padding:1.1rem .8rem; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  aside .brand { display:flex; gap:.7rem; align-items:center; padding:.3rem .5rem 1.2rem; }

  .logo { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-weight:800; font-size:1.1rem; box-shadow:0 4px 12px rgba(59,91,219,.45); }
  .logo.big { width:56px; height:56px; font-size:1.7rem; margin:0 auto .75rem; border-radius:16px; }
  aside nav { display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
  aside nav button { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; background:none; border:0; color:var(--side-ink); padding:.6rem .75rem; border-radius:10px; cursor:pointer; font:inherit; transition:background .15s,color .15s; }
  aside nav button .ico { width:22px; text-align:center; opacity:.85; font-size:1.05rem; }
  aside nav button:hover { background:rgba(255,255,255,.08); color:#fff; border-color:transparent; }
  aside nav button.active { background:rgba(255,255,255,.14); color:#fff; font-weight:600; box-shadow:inset 3px 0 0 var(--brand-2); }
  .usercard { margin-top:.75rem; padding:.75rem; border-radius:12px; background:rgba(255,255,255,.07); }
  .usercard .uname { color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .usercard .muted { color:var(--side-ink); opacity:.7; }
  .usercard button { background:rgba(255,255,255,.1); color:#fff; border-color:transparent; } .usercard button:hover { background:rgba(255,255,255,.2); }
  .avatar { display:grid; place-items:center; flex:none; width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-weight:700; font-size:.85rem; }
  main { padding:1.5rem 1.75rem 3rem; min-width:0; max-width:1320px; width:100%; }
  .topbar { display:flex; gap:.75rem; align-items:center; margin-bottom:1.1rem; flex-wrap:wrap; } .topbar h2 { margin:0; } .topbar .date { font-size:.85rem; }

  /* --- komponen --- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:var(--shadow); }
  .table-wrap { overflow-x:auto; margin:0 -.2rem; } table { border-collapse:separate; border-spacing:0; width:100%; }
  th,td { text-align:left; padding:.7rem .75rem; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  td.wrap { white-space:normal; min-width:220px; } th { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; background:var(--bg); }
  th:first-child { border-radius:8px 0 0 8px; } th:last-child { border-radius:0 8px 8px 0; } tbody tr:hover td { background:var(--brand-soft); } tbody tr:last-child td { border-bottom:0; }
  button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:.45rem .85rem; border-radius:10px; cursor:pointer; transition:all .15s; }
  button:hover { border-color:var(--brand); color:var(--brand); } button:disabled { opacity:.55; cursor:default; }
  button.primary { background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:var(--brand-ink); border-color:transparent; font-weight:600; box-shadow:0 2px 8px rgba(59,91,219,.3); }
  button.primary:hover { color:var(--brand-ink); filter:brightness(1.07); } button.ghost { background:transparent; }

  input, select, textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.5rem .7rem; width:100%; transition:border-color .15s, box-shadow .15s; }

  input[type=checkbox], input[type=radio] { width:auto; accent-color:var(--brand); } textarea { min-height:90px; resize:vertical; }
  label.field { display:block; margin-bottom:.8rem; } label.field > span { display:block; font-weight:600; margin-bottom:.25rem; }
  label.field small { color:var(--muted); display:block; margin-top:.2rem; } label.check { display:flex; gap:.5rem; align-items:center; margin-bottom:.75rem; }
  .badge { display:inline-block; padding:.1rem .6rem; border-radius:999px; font-size:.76rem; font-weight:600; background:var(--bg); color:var(--muted); }
  .badge.ok { color:var(--ok); background:var(--ok-soft); } .badge.warn { color:var(--warn); background:var(--warn-soft); } .badge.off { color:var(--muted); }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.08em; background:var(--bg); padding:.1rem .4rem; border-radius:6px; }
  .filters { margin-bottom:.9rem; }

  /* --- beranda --- */
  .hero { display:flex; gap:1rem; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:1.4rem 1.5rem; margin-bottom:1rem; border-radius:var(--radius); color:#fff;
          background:linear-gradient(120deg,#3b5bdb,#6741d9 70%,#8b5cf6); box-shadow:0 8px 24px rgba(59,91,219,.3); }
  .hero h2 { color:#fff; margin:0 0 .15rem; font-size:1.5rem; } .hero p { margin:0; opacity:.85; }
  .hero button { background:#fff; color:#3b3fbf; border-color:transparent; font-weight:600; } .hero button.ghost { background:rgba(255,255,255,.16); color:#fff; box-shadow:none; }
  .hero button:hover { filter:brightness(.96); color:#3b3fbf; } .hero button.ghost:hover { color:#fff; background:rgba(255,255,255,.26); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.9rem; margin-bottom:1rem; }
  .tile { display:flex; flex-direction:column; gap:.15rem; text-align:left; padding:1rem 1.1rem; border-radius:var(--radius); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tone,var(--brand)); }
  .tile:hover { transform:translateY(-2px); border-color:var(--tone,var(--brand)); } .tile.green { --tone:var(--ok); } .tile.amber { --tone:#e8870e; } .tile.violet { --tone:var(--brand-2); } .tile.blue { --tone:var(--brand); }
  .tile-label { color:var(--muted); font-size:.8rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; } .tile-value { font-size:2rem; font-weight:700; line-height:1.1; } .tile-hint { color:var(--muted); font-size:.8rem; }
  .stat-row { display:flex; gap:.6rem; flex-wrap:wrap; margin-left:auto; } .stat-mini { padding:.3rem .8rem; border-radius:10px; background:var(--bg); text-align:center; min-width:76px; }
  .stat-mini .v { font-weight:700; font-size:1.05rem; } .stat-mini .l { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  /* --- modal, toast, login --- */
  .overlay { position:fixed; inset:0; background:rgba(10,14,24,.55); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:5vh 1rem; z-index:50; }
  .modal { background:var(--card); border-radius:var(--radius); width:min(560px,100%); padding:1.4rem; border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,.3); animation:fade .2s ease both; } .modal.wide { width:min(900px,100%); }
  .modal .actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; } .err { color:var(--bad); margin:.5rem 0 0; } .picker { max-height:50vh; overflow:auto; }

  body:has(.login) { background:radial-gradient(1200px 500px at 50% -10%, var(--brand-soft), var(--bg)); }
  .login { max-width:400px; margin:11vh auto; padding:2rem; } .login h1 { text-align:center; }
  .opt-row { display:flex; gap:.5rem; align-items:center; margin-bottom:.4rem; } .opt-row input[type=text] { flex:1; }
  .qpreview { margin:.25rem 0 0; padding-left:1.1rem; } .qpreview .correct { color:var(--ok); font-weight:600; }

  @media (max-width:860px) {
    .layout { grid-template-columns:1fr; } aside { position:static; height:auto; flex-direction:column; padding:.7rem; }
    aside .brand { padding-bottom:.5rem; } aside nav { flex-direction:row; overflow-x:auto; gap:.25rem; padding-bottom:.25rem; } aside nav button { white-space:nowrap; width:auto; padding:.5rem .7rem; }
    aside nav button.active { box-shadow:inset 0 -3px 0 var(--brand-2); } .usercard { display:none; } main { padding:1rem; } .topbar .date { display:none; }
  }
  @media print { aside, .topbar button, .no-print, #toasts { display:none !important; } .layout { display:block; } .overlay { position:static; background:none; padding:0; } .modal { border:0; box-shadow:none; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
