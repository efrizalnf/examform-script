<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#667085; --line:#e4e7ec; --brand:#2f5fd0; --brand-ink:#fff;
          --ok:#12805c; --warn:#b54708; --bad:#c0362c; --radius:10px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --ink:#e8ebf2; --muted:#98a2b3; --line:#2b3245; --brand:#6d94ff; --brand-ink:#0b1020;
            --ok:#47c79c; --warn:#f0a15a; --bad:#ff7b70; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  h1,h2,h3 { margin:0 0 .5rem; line-height:1.25; } h2 { font-size:1.25rem; } h3 { font-size:1.05rem; }
  .muted { color:var(--muted); } .right { margin-left:auto; } .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .layout { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  aside { background:var(--card); border-right:1px solid var(--line); padding:1rem .75rem; }
  aside .brand { font-weight:700; font-size:1.1rem; padding:.25rem .5rem 1rem; }
  aside nav button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink); padding:.55rem .75rem; border-radius:8px; cursor:pointer; font:inherit; }
  aside nav button:hover { background:var(--bg); } aside nav button.active { background:var(--brand); color:var(--brand-ink); font-weight:600; }
  main { padding:1.25rem; min-width:0; } .topbar { display:flex; gap:.75rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem; margin-bottom:1rem; }
  .table-wrap { overflow-x:auto; } table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:.55rem .6rem; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  td.wrap { white-space:normal; min-width:200px; } th { font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:.4rem .75rem; border-radius:8px; cursor:pointer; }
  button:hover { border-color:var(--brand); } button:disabled { opacity:.55; cursor:default; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  button.danger { color:var(--bad); } button.small { padding:.2rem .5rem; font-size:.85em; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.45rem .6rem; width:100%; }
  input[type=checkbox], input[type=radio] { width:auto; } textarea { min-height:90px; resize:vertical; }
  label.field { display:block; margin-bottom:.75rem; } label.field > span { display:block; font-weight:600; margin-bottom:.25rem; }
  label.field small { color:var(--muted); display:block; margin-top:.2rem; } label.check { display:flex; gap:.5rem; align-items:center; margin-bottom:.75rem; }
  .badge { display:inline-block; padding:.05rem .5rem; border-radius:999px; font-size:.78rem; border:1px solid var(--line); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); } .badge.off { color:var(--muted); }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.08em; }
  .overlay { position:fixed; inset:0; background:rgba(10,14,24,.55); display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:3vh 1rem; z-index:50; }
  .modal { background:var(--card); border-radius:var(--radius); width:min(560px,100%); padding:1.25rem; border:1px solid var(--line); } .modal.wide { width:min(860px,100%); }
  .modal .actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; } .err { color:var(--bad); margin:.5rem 0 0; }
  #toasts { position:fixed; right:1rem; bottom:1rem; display:grid; gap:.5rem; z-index:99; }
  .toast { background:var(--ink); color:var(--bg); padding:.6rem .9rem; border-radius:8px; max-width:340px; } .toast.error { background:var(--bad); color:#fff; }
  .login { max-width:380px; margin:12vh auto; } .login h1 { text-align:center; }
  .opt-row { display:flex; gap:.5rem; align-items:center; margin-bottom:.4rem; } .opt-row input[type=text] { flex:1; }
  .qpreview { margin:.25rem 0 0; padding-left:1.1rem; } .qpreview .correct { color:var(--ok); font-weight:600; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); }
    aside nav { display:flex; gap:.25rem; overflow-x:auto; } aside nav button { white-space:nowrap; width:auto; } }
  @media print { aside, .topbar button, .no-print, #toasts { display:none !important; } .overlay { position:static; background:none; padding:0; } .modal { border:0; } }
</style>
