<script>
/* ===== Menu Admin ===== */
Views.admin.push(
  { id: 'guru', label: 'Guru', render: adminGuruView },
  { id: 'penugasan', label: 'Penugasan Guru', render: adminPenugasanView },
  { id: 'siswa', label: 'Siswa', render: adminSiswaView },
  { id: 'mapel', label: 'Mata Pelajaran', render: (box) => masterView(box, 'mapel', 'Mata pelajaran') },
  { id: 'jenis', label: 'Jenis Ujian', render: (box) => masterView(box, 'jenisUjian', 'Jenis ujian') },
  { id: 'ujian', label: 'Ujian, Soal & Form', render: (box) => ujianListView(box, 'admin') }
);

function adminGuruView(box) {
  const reload = () => adminGuruView(box);
  loading(box);
  api('admin.guru.list').then((list) => {
    const form = (g) => formModal({
      title: g ? 'Ubah guru' : 'Tambah guru',
      fields: [
        { name: 'nama', label: 'Nama', required: true }, { name: 'username', label: 'Username', required: true },
        { name: 'email', label: 'Email Google guru', type: 'email', hint: 'Hanya email ini yang diberi hak mengedit Google Form ujian guru tersebut.' },
        !g && { name: 'password', label: 'Password (kosongkan untuk generate otomatis)', type: 'text' },
        { name: 'aktif', label: 'Akun aktif', type: 'checkbox', default: true },
      ].filter(Boolean),
      initial: g, onSubmit: async (v) => {
        const r = await api('admin.guru.save', Object.assign({ id: g && g.id }, v));
        if (r.password) showCredentials('Akun guru dibuat', [r], [{ key: 'nama', label: 'Nama' }, { key: 'username', label: 'Username' }, { key: 'password', label: 'Password' }]);
        reload();
      },
    });
    const emailForm = (g) => formModal({
      title: 'Email Google guru — ' + g.nama,
      fields: [{ name: 'email', label: 'Alamat email', type: 'email', hint: 'Hanya email ini yang boleh mengedit Google Form ujian guru tersebut. Setelah mengubah, klik "Atur akses edit" pada ujian yang sudah di-deploy.' }],
      initial: { email: g.email || '' },
      onSubmit: async (v) => { await api('admin.guru.save', { id: g.id, username: g.username, nama: g.nama, aktif: g.aktif, email: v.email }); toast('Email guru disimpan.'); reload(); },
    });
    box.replaceChildren(
      h('div', { style: 'margin-bottom:1rem' }, h('button', { class: 'primary', onclick: () => form(null) }, '+ Tambah guru')),
      h('div', { class: 'card' }, dataTable([
        { label: 'Nama', key: 'nama' }, { label: 'Username', key: 'username' },
        { label: 'Email', render: (g) => h('button', { class: 'small ghost', title: 'Klik untuk mengubah email', onclick: () => emailForm(g) }, g.email || '+ isi email') }, { label: 'Status', render: (g) => badge(g.aktif) },
        { label: 'Penugasan', key: 'jumlahPenugasan' },
        { label: 'Aksi', render: (g) => h('div', { class: 'row' },
          actionBtn('Ubah', async () => form(g)),
          actionBtn('Email', async () => emailForm(g)),
          actionBtn('Atur mapel', async () => App.nav.go('penugasan')),
          actionBtn('Reset password', async () => { if (await confirmBox(`Reset password ${g.nama}?`)) { const r = await api('admin.guru.resetPassword', { id: g.id }); showCredentials('Password baru', [Object.assign({ nama: g.nama }, r)], [{ key: 'nama', label: 'Nama' }, { key: 'username', label: 'Username' }, { key: 'password', label: 'Password' }]); } }),
          actionBtn('Hapus', async () => { if (await confirmBox(`Hapus guru ${g.nama}?`)) { await api('admin.guru.remove', { id: g.id }); reload(); } }, 'danger')) },
      ], list, 'Belum ada guru.')));
  }).catch(fail);
}

function adminPenugasanView(box) {
  const reload = () => adminPenugasanView(box);
  loading(box);
  Promise.all([api('admin.penugasan.list'), api('admin.guru.list'), api('admin.mapel.list'), api('admin.jenisUjian.list')]).then(([list, guru, mapel, jenis]) => {
    const opt = (arr, label) => arr.map((x) => ({ value: x.id, label: label(x) }));
    const form = (p) => {
      if (!guru.length || !mapel.length || !jenis.length) return toast('Lengkapi data guru, mata pelajaran, dan jenis ujian terlebih dahulu.', 'error');
      formModal({
        title: p ? 'Ubah penugasan' : 'Tambah penugasan',
        fields: [
          { name: 'guruId', label: 'Guru', type: 'select', required: true, options: opt(guru, (g) => g.nama) },
          { name: 'mapelId', label: 'Mata pelajaran', type: 'select', required: true, options: opt(mapel, (m) => m.nama) },
          { name: 'jenisUjianId', label: 'Jenis ujian', type: 'select', required: true, options: opt(jenis, (j) => j.nama) },
          { name: 'durasiMenit', label: 'Waktu ujian default (menit)', type: 'number', min: 1, max: 600, required: true },
        ],
        initial: p || { durasiMenit: 60 },
        onSubmit: async (v) => { await api('admin.penugasan.save', Object.assign({ id: p && p.id }, v)); toast('Penugasan disimpan.'); reload(); },
      });
    };
    box.replaceChildren(
      h('div', { style: 'margin-bottom:1rem' }, h('button', { class: 'primary', onclick: () => form(null) }, '+ Tambah penugasan'),
        h('span', { class: 'muted', style: 'margin-left:.75rem' }, 'Status aktif mapel diatur oleh guru yang bersangkutan.')),
      h('div', { class: 'card' }, dataTable([
        { label: 'Guru', key: 'guruNama' }, { label: 'Mata pelajaran', key: 'mapelNama' }, { label: 'Jenis ujian', key: 'jenisUjianNama' },
        { label: 'Waktu (menit)', key: 'durasiMenit' }, { label: 'Mapel aktif', render: (p) => badge(p.aktif) },
        { label: 'Aksi', render: (p) => h('div', { class: 'row' }, actionBtn('Ubah', async () => form(p)),
          actionBtn('Hapus', async () => { if (await confirmBox('Hapus penugasan ini?')) { await api('admin.penugasan.remove', { id: p.id }); reload(); } }, 'danger')) },
      ], list, 'Belum ada penugasan.')));
  }).catch(fail);
}

function masterView(box, key, label) {
  const reload = () => masterView(box, key, label);
  loading(box);
  api(`admin.${key}.list`).then((list) => {
    const form = (m) => formModal({
      title: `${m ? 'Ubah' : 'Tambah'} ${label.toLowerCase()}`, fields: [{ name: 'nama', label: 'Nama', required: true }], initial: m,
      onSubmit: async (v) => { await api(`admin.${key}.save`, { id: m && m.id, nama: v.nama }); reload(); },
    });
    box.replaceChildren(h('div', { style: 'margin-bottom:1rem' }, h('button', { class: 'primary', onclick: () => form(null) }, `+ Tambah ${label.toLowerCase()}`)),
      h('div', { class: 'card' }, dataTable([{ label: 'Nama', key: 'nama' }, { label: 'Aksi', render: (m) => h('div', { class: 'row' },
        actionBtn('Ubah', async () => form(m)),
        actionBtn('Hapus', async () => { if (await confirmBox(`Hapus "${m.nama}"?`)) { await api(`admin.${key}.remove`, { id: m.id }); reload(); } }, 'danger')) }], list)));
  }).catch(fail);
}

function adminSiswaView(box) {
  const kelas = h('input', { placeholder: 'Filter kelas, mis. X-1', style: 'width:180px' });
  const q = h('input', { placeholder: 'Cari nama / NIS', style: 'width:200px' });
  const jenjang = h('select', { style: 'width:150px', onchange: () => load() }, h('option', { value: '' }, 'Semua jenjang'), JENJANG.map((j) => h('option', { value: j }, j)));
  const holder = h('div', { class: 'card' });
  let timer;
  const load = () => {
    loading(holder);
    api('admin.siswa.list', { kelas: kelas.value.trim(), jenjang: jenjang.value, q: q.value.trim() }).then((list) => {
      const form = (s) => formModal({
        title: s ? 'Ubah siswa' : 'Tambah siswa',
        fields: [
          { name: 'nis', label: 'NIS', required: true, hint: s ? 'NIS tidak dapat diubah.' : '' },
          { name: 'nama', label: 'Nama', required: true }, { name: 'kelas', label: 'Kelas', required: true },
          { name: 'jenjang', label: 'Jenjang', type: 'select', required: true, options: JENJANG.map((j) => ({ value: j, label: j })) },
          { name: 'aktif', label: 'Akun aktif', type: 'checkbox', default: true },
        ], initial: s,
        onSubmit: async (v) => {
          const r = await api('admin.siswa.save', v);
          if (r.password) showCredentials('Siswa ditambahkan', [r]);
          load();
        },
      });
      holder.replaceChildren(h('p', { class: 'muted' }, `${list.length} siswa`), dataTable([
        { label: 'NIS', key: 'nis' }, { label: 'Nama', key: 'nama' }, { label: 'Kelas', key: 'kelas' }, { label: 'Jenjang', key: 'jenjang' },
        { label: 'Status', render: (s) => badge(s.aktif) },
        { label: 'Aksi', render: (s) => h('div', { class: 'row' }, actionBtn('Ubah', async () => form(s)),
          actionBtn('Generate password', async () => { const r = await api('admin.siswa.generatePasswords', { nisList: [s.nis] }); showCredentials('Password baru', r); }),
          actionBtn('Hapus', async () => { if (await confirmBox(`Hapus siswa ${s.nama}?`)) { await api('admin.siswa.remove', { nis: s.nis }); load(); } }, 'danger')) },
      ], list, 'Tidak ada siswa.'));
      holder._form = form;
    }).catch(fail);
  };
  const importDialog = () => {
    const ta = h('textarea', { style: 'min-height:200px', placeholder: '00123\tAni Wijaya\tX-1\tSMA/MA\n00124\tBudi\tX-1\tSMA/MA' });
    openModal({
      title: 'Impor siswa', wide: true,
      content: h('div', null, h('p', { class: 'muted' }, 'Tempel dari Excel/Sheets. Kolom: NIS, Nama, Kelas, Jenjang (pisah Tab atau koma). Jenjang: SD/MI, SMP/MTs, atau SMA/MA (SD, MI, SMP, MTS, SMA, MA juga dikenali). NIS yang sudah ada akan diperbarui; siswa baru otomatis diberi password.'), ta),
      buttons: [{ label: 'Batal' }, { label: 'Impor', kind: 'primary', onClick: async () => {
        const rows = ta.value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
          const c = l.split(l.indexOf('\t') >= 0 ? '\t' : ',').map((x) => x.trim());
          return { nis: c[0], nama: c[1], kelas: c[2], jenjang: c[3] };
        });
        if (!rows.length) throw { message: 'Tidak ada data.' };
        const r = await api('admin.siswa.import', { siswa: rows });
        toast(`Ditambah ${r.ditambah}, diperbarui ${r.diperbarui}, gagal ${r.gagal.length}.`);
        if (r.gagal.length) toast(r.gagal.slice(0, 3).map((g) => `Baris ${g.baris}: ${g.pesan}`).join(' | '), 'error');
        if (r.kredensial.length) showCredentials('Password siswa baru', r.kredensial);
        load();
      } }],
    });
  };
  const bulkDialog = () => formModal({
    title: 'Generate password massal',
    fields: [
      { name: 'kelas', label: 'Kelas (kosongkan = semua siswa)' },
      { name: 'jenjang', label: 'Jenjang (opsional)', type: 'select', options: [{ value: '', label: 'Semua jenjang' }].concat(JENJANG.map((j) => ({ value: j, label: j }))) },
    ],
    submitLabel: 'Generate',
    onSubmit: async (v) => {
      if (!v.kelas && !v.jenjang && !(await confirmBox('Password SEMUA siswa akan diganti. Lanjutkan?'))) return;
      const r = await api('admin.siswa.generatePasswords', { kelas: v.kelas, jenjang: v.jenjang });
      showCredentials(`Password baru (${r.length} siswa)`, r);
    },
  });
  box.replaceChildren(
    h('div', { class: 'row', style: 'margin-bottom:1rem' },
      h('button', { class: 'primary', onclick: () => holder._form && holder._form(null) }, '+ Tambah siswa'),
      h('button', { onclick: importDialog }, 'Impor massal'), h('button', { onclick: bulkDialog }, 'Generate password massal'),
      h('span', { class: 'right row' }, jenjang, kelas, q)),
    holder);
  [kelas, q].forEach((i) => i.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 350); }));
  load();
}
</script>
